<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>КХЛ Карточки</title>
    <style>
        body { background-color: #0f172a; color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 20px; height: 100vh; margin: 0; overflow-y: auto; overflow-x: hidden; }
        h2 { margin-top: 0; }
    /* --- НОВЫЙ ДИЗАЙН КАРТОЧКИ --- */
.card { 
    background: linear-gradient(145deg, #1e293b, #0f172a); 
    border: 2px solid #e11d48; 
    border-radius: 20px; 
    width: 320px; 
    height: 520px; /* Сделали чуть выше */
    box-shadow: 0 10px 25px rgba(225, 29, 72, 0.2); 
    position: relative; 
    transition: border-color 0.3s; 
    flex-shrink: 0; 
    display: flex;
    flex-direction: column;
    overflow: hidden;
    justify-content: flex-end; /* Прижимаем контент вниз */
}

/* Фото (занимает 65% высоты) */
.card-image-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 65%;
    background-color: #334155;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    overflow: hidden;
}
.card-image-container img {
    width: 100%;
    height: 100%;
    object-fit: cover; 
    object-position: top center;
}

/* Общий рейтинг (OVR) в левом верхнем углу */
.overall-badge {
    position: absolute;
    top: 10px;
    left: 10px;
    background-color: #0f172a;
    border: 2px solid #fbbf24;
    color: #fbbf24;
    font-size: 28px;
    font-weight: bold;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    z-index: 10;
}

/* Номер игрока (снизу справа на фото) */
.number-badge {
    position: absolute;
    top: 70px; /* Под рейтингом */
    left: 15px;
    color: rgba(255,255,255,0.8);
    font-size: 30px;
    font-weight: bold;
    font-style: italic;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    z-index: 10;
}

/* Верхний правый угол (Сезон и Эмблема) */
.top-right-info {
    position: absolute;
    top: 10px;
    right: 10px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 5px;
    z-index: 10;
}

.season-badge { background-color: #e11d48; color: white; font-size: 14px; font-weight: bold; padding: 4px 10px; border-radius: 10px; }

/* Эмблема теперь под сезоном */
.club-logo {
    width: 45px;
    height: 45px;
    background-color: white; 
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: bold;
    color: black;
    box-shadow: 0 2px 5px rgba(0,0,0,0.5);
}

/* Нижняя часть (Имя и Статы) */
.card-info {
    position: relative;
    z-index: 20;
    background: linear-gradient(to top, #0f172a 80%, transparent);
    padding: 10px 15px;
    width: 100%;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.name { font-size: 24px; font-weight: bold; margin-bottom: 2px; text-transform: uppercase; text-align: center; text-shadow: 1px 1px 3px black;}
.club { color: #cbd5e1; font-size: 16px; margin-bottom: 2px; text-align: center;}
.position { color: #e11d48; font-size: 16px; font-weight: bold; margin-bottom: 15px;}

/* Увеличенные характеристики */
.stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; width: 100%; margin-bottom: 10px;}
.stat { font-size: 14px; color: #94a3b8; display: flex; flex-direction: column; align-items: center; }
.stat span { font-size: 28px; font-weight: bold; color: white; margin-top: 2px; } /* Увеличили шрифт вдвое */
        
        .btn-open { margin-top: 20px; padding: 15px 30px; background-color: #e11d48; color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; width: 300px; transition: 0.2s; box-shadow: 0 4px 15px rgba(225, 29, 72, 0.4); }
        .btn-open:active { transform: scale(0.95); }
        .btn-bonus { margin-top: 10px; padding: 10px; background-color: #10b981; color: white; border: none; border-radius: 12px; font-size: 14px; font-weight: bold; cursor: pointer; width: 300px; display: none; }
        
        .coins-display { margin-bottom: 15px; font-size: 18px; font-weight: bold; color: #fbbf24; }
        
        #collectionView { display: none; width: 100%; max-width: 320px; flex-direction: column; align-items: center; padding-top: 20px; }
        .collection-list { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; width: 100%; padding-bottom: 50px; }
        
        .mini-card { background-color: #1e293b; padding: 15px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid #e11d48; cursor: pointer; transition: 0.2s; position: relative; z-index: 99; }
        .mini-card:active { transform: scale(0.98); }
        .mini-card.legendary { border-left-color: #fbbf24; }
        .mini-card.epic { border-left-color: #a855f7; }
        
        .count-badge { background-color: #e11d48; color: white; font-size: 12px; font-weight: bold; padding: 2px 6px; border-radius: 10px; margin-left: 5px; }
        
        .btn-nav { margin-top: 15px; background-color: #3b82f6; color: white; border: none; padding: 12px; border-radius: 10px; width: 300px; font-weight: bold; cursor: pointer; }

        .btn-season { margin-top: 10px; padding: 15px; background-color: #1e293b; color: white; border: 2px solid #3b82f6; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; width: 300px; transition: 0.2s; text-align: left; display: flex; justify-content: space-between; align-items: center;}
        .btn-season:active { transform: scale(0.95); background-color: #334155; }
        .btn-season span.price { color: #fbbf24; }
        #packsView { display: none; width: 100%; flex-direction: column; align-items: center; }

        #detailView { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(15, 23, 42, 0.95); z-index: 9999; flex-direction: column; align-items: center; justify-content: center; }
        
        .flip-card { background-color: transparent; width: 300px; height: 480px; perspective: 1000px; cursor: pointer; }
        .flip-card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s; transform-style: preserve-3d; }
        .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
        
        .flip-card-front, .flip-card-back { position: absolute; width: 100%; height: 100%; -webkit-backface-visibility: hidden; backface-visibility: hidden; border-radius: 20px; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; }
        
        .flip-card-front { background: linear-gradient(145deg, #1e293b, #0f172a); border: 2px solid #e11d48; justify-content: center; }
        
        .flip-card-back { background: linear-gradient(145deg, #0f172a, #1e293b); border: 2px solid #3b82f6; transform: rotateY(180deg); color: white; justify-content: center; }
        
        .stats-section { width: 100%; margin-bottom: 10px; }
        .stats-header { font-size: 14px; color: #3b82f6; font-weight: bold; margin-bottom: 8px; text-transform: uppercase; border-bottom: 1px solid #334155; padding-bottom: 4px; text-align: left; }
        
        .back-stat-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; color: #cbd5e1; }
        .back-stat-row span:last-child { font-weight: bold; color: white; }
        
        .divider { width: 100%; height: 2px; background: linear-gradient(90deg, transparent, #3b82f6, transparent); margin: 10px 0; }
        
        .detail-buttons { margin-top: 20px; display: flex; gap: 10px; }
        .btn-sell { background-color: #ef4444; color: white; border: none; padding: 12px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .btn-close { background-color: #64748b; color: white; border: none; padding: 12px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
  
    <!-- ГЛАВНЫЙ ЭКРАН (Магазин) -->

        const PLAYERS = [

        sc: 88, br: 85, ps: 99, si: 75, end: 85, skate: 92, rarity: "Эпическая", 
        img: "https://nikitasokolovskij19-glitch.github.io/hockey-cards/Datsyuk_1x.png", 
        reg_stats: { games: 60, goals: 12, assists: 35, points: 47, penalty: 16 },

    },
    { 
        name: "Александр Овечкин", club: "Динамо М", season: "2012/13", pos: "Нападающий", number: "#32", logo: "Дин",

    },

        sc: 90, br: 88, ps: 85, si: 70, end: 82, skate: 88, rarity: "Золотая",

    },
    {

        sc: 92, br: 90, ps: 75, si: 80, end: 86, skate: 87, rarity: "Золотая", 
        img: "https://nikitasokolovskij19-glitch.github.io/hockey-cards/Datsyuk_1x.png", 
        reg_stats: { games: 50, goals: 25, assists: 15, points: 40, penalty: 30 },
        playoff_stats: null 
    }
];

        let tg = window.Telegram.WebApp;
        tg.expand();

        // ОДНОРАЗОВАЯ ОЧИСТКА
        if (!localStorage.getItem('cleaned_v2')) {
            localStorage.removeItem('khl_collection');
            localStorage.removeItem('khl_coins');
            localStorage.setItem('cleaned_v2', 'true');
        }

        let userCoins = parseInt(localStorage.getItem('khl_coins')) || 100;
        let collection = JSON.parse(localStorage.getItem('khl_collection')) || [];
        let currentViewPlayer = null;

        const coinDisplay = document.getElementById('coinDisplay');
        const bonusBtn = document.getElementById('bonusBtn');
        const shopView = document.getElementById('shopView');
        const packsView = document.getElementById('packsView');
        const collectionView = document.getElementById('collectionView');
        const detailView = document.getElementById('detailView');
        const collectionList = document.getElementById('collectionList');
        const packPrice = 50;

        function updateUI() {
            coinDisplay.innerText = userCoins;
            localStorage.setItem('khl_coins', userCoins);
            
            if (userCoins < packPrice) {
                document.getElementById('goToPacksBtn').style.display = 'none';
                bonusBtn.style.display = 'block';
            } else {
                document.getElementById('goToPacksBtn').style.display = 'block';
                bonusBtn.style.display = 'none';
            }
        }

        bonusBtn.addEventListener('click', function() {
            userCoins += 50;
            updateUI();
            alert("Ты получил 50 монет!");
        });

        // --- НАВИГАЦИЯ ---
        document.getElementById('goToPacksBtn').addEventListener('click', function() {
            shopView.style.display = 'none';
            packsView.style.display = 'flex';
        });

        document.getElementById('backFromPacksBtn').addEventListener('click', function() {
            packsView.style.display = 'none';
            shopView.style.display = 'flex';
        });

        document.getElementById('viewCollectionBtn').addEventListener('click', function() {
            shopView.style.display = 'none';
            collectionView.style.display = 'flex';
            renderCollection();
        });

        document.getElementById('backToShopBtn').addEventListener('click', function() {
            collectionView.style.display = 'none';
            shopView.style.display = 'flex';
        });

        // --- ФУНКЦИЯ ПОКУПКИ ПАКА ---
        function buyPack(season, price) {
    if (userCoins < price) {
        alert("У тебя не хватает монет!");
        return;
    }

    const availablePlayers = PLAYERS.filter(p => p.season === season);

    if (availablePlayers.length === 0) {
        alert("В этом сезоне пока нет игроков в базе. Попробуй другой!");
        return;
    }

    userCoins -= price;
    updateUI();

    const randomIndex = Math.floor(Math.random() * availablePlayers.length);
    const player = availablePlayers[randomIndex];
    
    collection.push(player);
    localStorage.setItem('khl_collection', JSON.stringify(collection));

    // Скрываем меню паков
    packsView.style.display = 'none';

    // Заполняем карточку для показа
    document.getElementById('r-name').innerText = player.name;
    document.getElementById('r-club').innerText = player.club;
    document.getElementById('r-season').innerText = player.season;
    document.getElementById('r-position').innerText = player.pos;
    document.getElementById('r-sc').innerText = player.sc;
    document.getElementById('r-br').innerText = player.br;
    document.getElementById('r-ps').innerText = player.ps;
    document.getElementById('r-si').innerText = player.si;
    document.getElementById('r-end').innerText = player.end;
    document.getElementById('r-skate').innerText = player.skate;
    
    document.getElementById('r-number').innerText = player.number || "";
    document.getElementById('r-clubLogo').innerText = player.logo || "КХЛ";
    
    const overall = Math.round((player.sc + player.br + player.ps + player.si + player.end + player.skate) / 6);
    document.getElementById('r-overall').innerText = overall;
    
    document.getElementById('r-img').innerHTML = `<img src="${player.img}" style="width: 100%; height: 100%; object-fit: cover; object-position: top center;" onerror="this.style.display='none'; this.parentNode.innerText='🏒';">`;

    const borderColor = player.rarity === "Легендарная" ? "#fbbf24" : (player.rarity === "Эпическая" ? "#a855f7" : "#e11d48");
    document.getElementById('revealCard').style.borderColor = borderColor;

    // Показываем окно с анимацией
    const revealView = document.getElementById('revealView');
    revealView.style.display = 'flex';
    
    // Сбрасываем анимацию в начальное состояние
    const revealCard = document.getElementById('revealCard');
    const revealText = document.getElementById('revealText');
    const closeBtn = document.getElementById('closeRevealBtn');
    
    revealCard.style.transform = 'scale(0)';
    revealText.style.opacity = '0';
    revealText.style.transform = 'translateY(-50px)';
    closeBtn.style.opacity = '0';

    // Запускаем анимацию появления (через миллисекунду)
    setTimeout(() => {
        revealCard.style.transform = 'scale(1)';
        revealText.style.opacity = '1';
        revealText.style.transform = 'translateY(0)';
        closeBtn.style.opacity = '1';
    }, 100);
}

// Кнопка закрытия окна с выпавшим игроком
document.getElementById('closeRevealBtn').addEventListener('click', function() {
    document.getElementById('revealView').style.display = 'none';
    shopView.style.display = 'flex'; // Возвращаемся на главный экран
});

            alert(`Тебе выпал: ${player.name} (${player.season})!`);
        }

        // --- ОТРИСОВКА КОЛЛЕКЦИИ ---
        function renderCollection() {
            collectionList.innerHTML = ''; 
            const grouped = {};
            collection.forEach(player => {
                const key = `${player.name}_${player.season}`;
                if (!grouped[key]) {
                    grouped[key] = { ...player, count: 0 };
                }
                grouped[key].count += 1;
            });

            const groupedArray = Object.values(grouped);

            groupedArray.forEach(player => {
                const div = document.createElement('div');
                let rarityClass = '';
                if (player.rarity === 'Легендарная') rarityClass = 'legendary';
                if (player.rarity === 'Эпическая') rarityClass = 'epic';

                const overall = Math.round((player.sc + player.br + player.ps + player.si + player.end + player.skate) / 6);

                div.className = `mini-card ${rarityClass}`;
                div.innerHTML = `
                    <div style="flex: 1;">
                        <div style="font-weight: bold; display: flex; align-items: center;">
                            ${player.name} 
                            ${player.count > 1 ? `<span class="count-badge">x${player.count}</span>` : ''}
                        </div>
                        <div style="font-size: 12px; color: #aaa;">${player.club} • ${player.season}</div>
                    </div>
                    <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 5px;">
                        <div style="color: #fbbf24; font-weight: bold; font-size: 18px;">${overall}</div>
                        <button class="open-card-btn" data-name="${player.name}" data-season="${player.season}" style="background: #3b82f6; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer;">Открыть</button>
                    </div>
                `;
                
                collectionList.appendChild(div);
            });

            document.querySelectorAll('.open-card-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation(); 
                    const name = this.getAttribute('data-name');
                    const season = this.getAttribute('data-season');
                    
                    const playerToOpen = Object.values(grouped).find(p => p.name === name && p.season === season);
                    if (playerToOpen) {
                        openDetailView(playerToOpen);
                    }
                });
            });
        }

        // --- ДЕТАЛЬНЫЙ ПРОСМОТР ---
        function openDetailView(player) {
    currentViewPlayer = player;
    
    // Заполняем лицевую сторону
    document.getElementById('d-name').innerText = player.name;
    document.getElementById('d-club').innerText = player.club;
    document.getElementById('d-season').innerText = player.season;
    document.getElementById('d-pos').innerText = player.pos;
    document.getElementById('d-sc').innerText = player.sc;
    document.getElementById('d-br').innerText = player.br;
    document.getElementById('d-ps').innerText = player.ps;
    document.getElementById('d-si').innerText = player.si;
    document.getElementById('d-end').innerText = player.end;
    document.getElementById('d-skate').innerText = player.skate;
    
    // Новые поля
    document.getElementById('d-number').innerText = player.number || "";
    document.getElementById('d-clubLogo').innerText = player.logo || "КХЛ";
    
    // Общий рейтинг
    const overall = Math.round((player.sc + player.br + player.ps + player.si + player.end + player.skate) / 6);
    document.getElementById('d-overall').innerText = overall;
    
    // Картинка
    document.getElementById('d-img').innerHTML = `<img src="${player.img}" style="width: 100%; height: 100%; object-fit: cover; object-position: top center;" onerror="this.style.display='none'; this.parentNode.innerText='🏒';">`;

    // Кнопка продажи
    const sellPrice = overall * 2;
    document.getElementById('detailSellBtn').innerText = `Продать одну (${sellPrice} 🪙)`;

    // Задняя сторона (статистика)
    const backSide = document.getElementById('detailBack');
    let html = `
        <h3 style="margin-top: 0; font-size: 18px; color: white;">${player.name}</h3>
        <div class="stats-section">
            <div class="stats-header">Регулярный чемпионат</div>
            <div class="back-stat-row"><span>Игры:</span> <span>${player.reg_stats.games}</span></div>
            <div class="back-stat-row"><span>Голы:</span> <span>${player.reg_stats.goals}</span></div>
            <div class="back-stat-row"><span>Пасы:</span> <span>${player.reg_stats.assists}</span></div>
            <div class="back-stat-row"><span>Очки:</span> <span>${player.reg_stats.points}</span></div>
            <div class="back-stat-row"><span>Штраф:</span> <span>${player.reg_stats.penalty}</span></div>
        </div>
    `;

    if (player.playoff_stats) {
        html += `
            <div class="divider"></div>
            <div class="stats-section">
                <div class="stats-header" style="color: #e11d48;">Плей-офф</div>
                <div class="back-stat-row"><span>Игры:</span> <span>${player.playoff_stats.games}</span></div>
                <div class="back-stat-row"><span>Голы:</span> <span>${player.playoff_stats.goals}</span></div>
                <div class="back-stat-row"><span>Пасы:</span> <span>${player.playoff_stats.assists}</span></div>
                <div class="back-stat-row"><span>Очки:</span> <span>${player.playoff_stats.points}</span></div>
                <div class="back-stat-row"><span>Штраф:</span> <span>${player.playoff_stats.penalty}</span></div>
            </div>
        `;
    } else {
        html += `<div style="height: 40px;"></div>`;
    }

    html += `<div style="margin-top: 15px; font-size: 12px; color: #64748b;">Нажми, чтобы перевернуть</div>`;
    backSide.innerHTML = html;

    // Показываем окно и сбрасываем переворот
    detailView.style.display = 'flex';
    document.getElementById('flipCard').classList.remove('flipped');
        }
        document.getElementById('flipCard').addEventListener('click', function() {
            this.classList.toggle('flipped');
        });

        document.getElementById('closeDetailBtn').addEventListener('click', function() {
            detailView.style.display = 'none';
            document.getElementById('flipCard').classList.remove('flipped');
            renderCollection();
        });

        document.getElementById('detailSellBtn').addEventListener('click', function() {
            if (!currentViewPlayer) return;

            const overall = Math.round((currentViewPlayer.sc + currentViewPlayer.br + currentViewPlayer.ps + currentViewPlayer.si + currentViewPlayer.end + currentViewPlayer.skate) / 6);
            const sellPrice = overall * 2;

            if (confirm(`Вы уверены, что хотите продать ${currentViewPlayer.name} за ${sellPrice} монет?`)) {
                const index = collection.findIndex(p => p.name === currentViewPlayer.name && p.season === currentViewPlayer.season);
                
                if (index !== -1) {
                    collection.splice(index, 1);
                    localStorage.setItem('khl_collection', JSON.stringify(collection));
                    
                    userCoins += sellPrice;
                    updateUI();
                    
                    alert(`Карточка продана! Вы получили ${sellPrice} 🪙`);
                    
                    const stillHave = collection.some(p => p.name === currentViewPlayer.name && p.season === currentViewPlayer.season);
                    if (stillHave) {
                        currentViewPlayer.count -= 1;
                        openDetailView(currentViewPlayer);
                    } else {
                        detailView.style.display = 'none';
                        document.getElementById('flipCard').classList.remove('flipped');
                    }
                    renderCollection();
                }
            }
        });

        updateUI();
    </script>
</body>
</html>
