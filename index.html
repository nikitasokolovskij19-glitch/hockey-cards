<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>КХЛ Карточки</title>
    <style>
        body { background-color: #0f172a; color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        .card { background: linear-gradient(145deg, #1e293b, #0f172a); border: 2px solid #e11d48; border-radius: 20px; padding: 20px; width: 280px; text-align: center; box-shadow: 0 10px 25px rgba(225, 29, 72, 0.2); position: relative; transition: border-color 0.3s; }
        .season-badge { position: absolute; top: 10px; right: 10px; background-color: #e11d48; color: white; font-size: 12px; font-weight: bold; padding: 4px 8px; border-radius: 10px; }
        .player-img { width: 120px; height: 120px; background-color: #334155; border-radius: 50%; margin: 10px auto 15px; display: flex; align-items: center; justify-content: center; font-size: 50px; border: 3px solid #475569; }
        .name { font-size: 22px; font-weight: bold; margin-bottom: 5px; text-transform: uppercase; }
        .club { color: #cbd5e1; font-size: 14px; margin-bottom: 5px; }
        .position { color: #e11d48; font-size: 14px; font-weight: bold; margin-bottom: 15px; }
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; border-top: 1px solid #334155; padding-top: 15px; }
        .stat { font-size: 12px; color: #94a3b8; display: flex; justify-content: space-between; padding: 0 10px; }
        .stat span { font-size: 16px; font-weight: bold; color: white; }
        .btn-open { margin-top: 25px; padding: 15px 30px; background-color: #e11d48; color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.2s; box-shadow: 0 4px 15px rgba(225, 29, 72, 0.4); }
        .btn-open:active { transform: scale(0.95); }
        .btn-bonus { margin-top: 10px; padding: 10px; background-color: #10b981; color: white; border: none; border-radius: 12px; font-size: 14px; font-weight: bold; cursor: pointer; width: 100%; display: none; }
        .coins-display { margin-bottom: 15px; font-size: 18px; font-weight: bold; color: #fbbf24; }
    </style>
</head>
<body>
    <h2>Твой первый игрок КХЛ</h2>
    <div class="coins-display">Баланс: <span id="coinDisplay">100</span> 🪙</div>
    
    <div class="card" id="playerCard">
        <div class="season-badge" id="season">2016/17</div>
        <div class="player-img" id="img">🏒</div>
        <div class="name" id="name">С. Мозякин</div>
        <div class="club" id="club">Металлург Мг</div>
        <div class="position" id="position">Нападающий</div>
        <div class="stats">
            <div class="stat">СКО <span id="sc">85</span></div>
            <div class="stat">БРС <span id="br">98</span></div>
            <div class="stat">ПАС <span id="ps">95</span></div>
            <div class="stat">СИЛ <span id="si">80</span></div>
        </div>
    </div>
    
    <button class="btn-open" id="openPackBtn">Открыть пак (50 🪙)</button>
    <button class="btn-bonus" id="bonusBtn">🎁 Получить бонус (+50 🪙)</button>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const PLAYERS = [
            { name: "С. Мозякин", club: "Металлург Мг", season: "2016/17", pos: "Нападающий", sc: 85, br: 98, ps: 95, si: 80, rarity: "Легендарная", img: "🏒" },
            { name: "П. Дацюк", club: "СКА", season: "2016/17", pos: "Нападающий", sc: 88, br: 85, ps: 99, si: 75, rarity: "Эпическая", img: "🏒" },
            { name: "А. Овечкин", club: "Динамо М", season: "2012/13", pos: "Нападающий", sc: 99, br: 94, ps: 70, si: 85, rarity: "Эпическая", img: "🏒" },
            { name: "Д. Зарипов", club: "Ак Барс", season: "2014/15", pos: "Нападающий", sc: 90, br: 88, ps: 85, si: 70, rarity: "Золотая", img: "🏒" },
            { name: "И. Ковальчук", club: "СКА", season: "2015/16", pos: "Нападающий", sc: 92, br: 90, ps: 75, si: 80, rarity: "Золотая", img: "🏒" }
        ];

        let tg = window.Telegram.WebApp;
        tg.expand();

        // Загружаем баланс из памяти телефона или ставим 100
        let userCoins = parseInt(localStorage.getItem('khl_coins')) || 100;
        let collection = JSON.parse(localStorage.getItem('khl_collection')) || [];
        
        const coinDisplay = document.getElementById('coinDisplay');
        const openPackBtn = document.getElementById('openPackBtn');
        const bonusBtn = document.getElementById('bonusBtn');
        const packPrice = 50;

        function updateUI() {
            coinDisplay.innerText = userCoins;
            localStorage.setItem('khl_coins', userCoins);
            
            if (userCoins < packPrice) {
                openPackBtn.style.display = 'none';
                bonusBtn.style.display = 'block';
            } else {
                openPackBtn.style.display = 'block';
                bonusBtn.style.display = 'none';
            }
        }

        openPackBtn.addEventListener('click', function() {
            userCoins -= packPrice;
            updateUI();
            
            openPackBtn.innerText = "Открываем...";
            
            const randomIndex = Math.floor(Math.random() * PLAYERS.length);
            const player = PLAYERS[randomIndex];
            collection.push(player);
            localStorage.setItem('khl_collection', JSON.stringify(collection));

            setTimeout(() => {
                document.getElementById('name').innerText = player.name;
                document.getElementById('club').innerText = player.club;
                document.getElementById('season').innerText = player.season;
                document.getElementById('position').innerText = player.pos;
                document.getElementById('sc').innerText = player.sc;
                document.getElementById('br').innerText = player.br;
                document.getElementById('ps').innerText = player.ps;
                document.getElementById('si').innerText = player.si;
                document.getElementById('img').innerText = player.img;

                const borderColor = player.rarity === "Легендарная" ? "#fbbf24" : (player.rarity === "Эпическая" ? "#a855f7" : "#e11d48");
                document.getElementById('playerCard').style.borderColor = borderColor;

                openPackBtn.innerText = `Открыть пак (50 🪙)`;
                alert(`Тебе выпал: ${player.name} (${player.rarity})!`);
                updateUI();
            }, 500);
        });

        bonusBtn.addEventListener('click', function() {
            userCoins += 50;
            updateUI();
            alert("Ты получил 50 монет! Приходи завтра за новым бонусом.");
        });

        updateUI();
    </script>
</body>
</html>
