<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>КХЛ Карточки</title>
    <style>
        body { background-color: #0f172a; color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 20px; height: 100vh; margin: 0; overflow-y: auto; overflow-x: hidden; }
        h2 { margin-top: 0; }
        
        /* ДИЗАЙН КАРТОЧКИ */
        .card { background: linear-gradient(145deg, #1e293b, #0f172a); border: 2px solid #e11d48; border-radius: 20px; width: 320px; height: 520px; box-shadow: 0 10px 25px rgba(225, 29, 72, 0.2); position: relative; transition: border-color 0.3s; flex-shrink: 0; display: flex; flex-direction: column; overflow: hidden; justify-content: flex-end; }
        .card-image-container { position: absolute; top: 0; left: 0; width: 100%; height: 65%; background-color: #334155; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; }
        .card-image-container img { width: 100%; height: 100%; object-fit: cover; object-position: top center; }
        .overall-badge { position: absolute; top: 10px; left: 10px; background-color: #0f172a; border: 2px solid #fbbf24; color: #fbbf24; font-size: 28px; font-weight: bold; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 10; }
        .number-badge { position: absolute; top: 70px; left: 15px; color: rgba(255,255,255,0.8); font-size: 30px; font-weight: bold; font-style: italic; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); z-index: 10; }
        .top-right-info { position: absolute; top: 10px; right: 10px; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; z-index: 10; }
        .season-badge { background-color: #e11d48; color: white; font-size: 14px; font-weight: bold; padding: 4px 10px; border-radius: 10px; }
        .club-logo { width: 45px; height: 45px; background-color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; color: black; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .card-info { position: relative; z-index: 20; background: linear-gradient(to top, #0f172a 80%, transparent); padding: 10px 15px; width: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; }
        .name { font-size: 24px; font-weight: bold; margin-bottom: 2px; text-transform: uppercase; text-align: center; text-shadow: 1px 1px 3px black;}
        .club { color: #cbd5e1; font-size: 16px; margin-bottom: 2px; text-align: center;}
        .position { color: #e11d48; font-size: 16px; font-weight: bold; margin-bottom: 15px;}
        .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; width: 100%; margin-bottom: 10px;}
        .stat { font-size: 14px; color: #94a3b8; display: flex; flex-direction: column; align-items: center; }
        .stat span { font-size: 28px; font-weight: bold; color: white; margin-top: 2px; }

        /* КНОПКИ И МЕНЮ */
        .btn-open { margin-top: 20px; padding: 15px 30px; background-color: #e11d48; color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; width: 300px; transition: 0.2s; box-shadow: 0 4px 15px rgba(225, 29, 72, 0.4); }
        .btn-open:active { transform: scale(0.95); }
        .btn-bonus { margin-top: 10px; padding: 10px; background-color: #10b981; color: white; border: none; border-radius: 12px; font-size: 14px; font-weight: bold; cursor: pointer; width: 300px; display: none; }
        .btn-nav { margin-top: 15px; background-color: #3b82f6; color: white; border: none; padding: 12px; border-radius: 10px; width: 300px; font-weight: bold; cursor: pointer; }
        .coins-display { margin-bottom: 30px; font-size: 24px; font-weight: bold; color: #fbbf24; }
        
        /* ЭКРАНЫ */
        #packsView { display: none; width: 100%; flex-direction: column; align-items: center; }
        .btn-season { margin-top: 10px; padding: 15px; background-color: #1e293b; color: white; border: 2px solid #3b82f6; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; width: 300px; transition: 0.2s; text-align: left; display: flex; justify-content: space-between; align-items: center;}
        .btn-season:active { transform: scale(0.95); background-color: #334155; }
        .btn-season span.price { color: #fbbf24; }

        #collectionView { display: none; width: 100%; flex-direction: column; align-items: center; padding-top: 20px; }
        #collectionContent { width: 100%; max-width: 320px; }
        #innerCollectionView { display: none; width: 100%; max-width: 320px; }
        
        .tab-btn { transition: 0.2s; padding: 10px 20px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .active-tab { background: #3b82f6 !important; box-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }

        .teams-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 100%; padding-bottom: 50px; }
        .team-logo-btn { background-color: #1e293b; border: 2px solid #334155; border-radius: 15px; padding: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; aspect-ratio: 1 / 1; }
        .team-logo-btn:active { transform: scale(0.95); border-color: #3b82f6; }
        .team-logo-img { width: 60px; height: 60px; background-color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: bold; color: black; margin-bottom: 10px; }
        .team-name-text { font-size: 12px; font-weight: bold; text-align: center; color: #cbd5e1; }
        
        .season-btn { background-color: #1e293b; padding: 12px 15px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid #3b82f6; cursor: pointer; margin-bottom: 10px; transition: 0.2s; }
        .season-btn:active { transform: scale(0.98); background-color: #334155; }

        .mini-card { background-color: #1e293b; padding: 15px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid #e11d48; cursor: pointer; transition: 0.2s; position: relative; z-index: 99; margin-bottom: 10px; }
        .mini-card:active { transform: scale(0.98); }
        .mini-card.common { border-left-color: #9ca3af; }
        .mini-card.rare { border-left-color: #a3e635; }
        .mini-card.super-rare { border-left-color: #3b82f6; }
        .mini-card.legendary { border-left-color: #fbbf24; }
        .mini-card.epic { border-left-color: #be123c; }
        
        /* ОКНА */
        #revealView, #detailView { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(15, 23, 42, 0.95); z-index: 9999; flex-direction: column; align-items: center; justify-content: center; }
        .flip-card { background-color: transparent; width: 320px; height: 520px; perspective: 1000px; cursor: pointer; }
        .flip-card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s; transform-style: preserve-3d; }
        .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
        .flip-card-front, .flip-card-back { position: absolute; width: 100%; height: 100%; -webkit-backface-visibility: hidden; backface-visibility: hidden; border-radius: 20px; box-sizing: border-box; }
        .flip-card-back { background: linear-gradient(145deg, #0f172a, #1e293b); border: 2px solid #3b82f6; transform: rotateY(180deg); color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;}
        
        .stats-section { width: 100%; margin-bottom: 10px; }
        .stats-header { font-size: 14px; color: #3b82f6; font-weight: bold; margin-bottom: 8px; text-transform: uppercase; border-bottom: 1px solid #334155; padding-bottom: 4px; text-align: left; }
        .back-stat-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 14px; color: #cbd5e1; }
        .back-stat-row span:last-child { font-weight: bold; color: white; }
        .divider { width: 100%; height: 2px; background: linear-gradient(90deg, transparent, #3b82f6, transparent); margin: 10px 0; }
        .detail-buttons { margin-top: 20px; display: flex; gap: 10px; width: 100%; justify-content: center; }
        .btn-sell { background-color: #ef4444; color: white; border: none; padding: 12px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .btn-close { background-color: #64748b; color: white; border: none; padding: 12px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    
<!-- ГЛАВНЫЙ ЭКРАН -->
<div id="shopView" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80vh;">
    <h2>Коллекция КХЛ</h2>
    <div class="coins-display">Баланс: <span id="coinDisplay">100</span> 🪙</div>
    <button class="btn-open" id="goToPacksBtn">🎁 Выбрать пак</button>
    <button class="btn-bonus" id="bonusBtn">🎁 Получить бонус (+50 🪙)</button>
    <button class="btn-nav" id="viewCollectionBtn">📂 Моя коллекция</button>
</div>

<!-- ЭКРАН ПАКОВ -->
<div id="packsView">
    <h2>Выбери сезон</h2>
    <button class="btn-season" onclick="buyPack('2016/17', 50)"><div>Сезон 2016/17</div><div class="price">50 🪙</div></button>
    <button class="btn-season" onclick="buyPack('2015/16', 50)"><div>Сезон 2015/16</div><div class="price">50 🪙</div></button>
    <button class="btn-season" onclick="buyPack('2014/15', 50)"><div>Сезон 2014/15</div><div class="price">50 🪙</div></button>
    <button class="btn-season" onclick="buyPack('2012/13', 50)"><div>Сезон 2012/13</div><div class="price">50 🪙</div></button>
    <button class="btn-nav" id="backFromPacksBtn" style="margin-top: 20px;">⬅ Назад</button>
</div>

<!-- ЭКРАН КОЛЛЕКЦИИ -->
<div id="collectionView">
    <h2>Моя коллекция</h2>
    <div style="display: flex; gap: 10px; margin-bottom: 20px;">
        <button id="tabTeamsBtn" class="tab-btn active-tab" style="background: #3b82f6; color: white;">По командам</button>
        <button id="tabSeasonsBtn" class="tab-btn" style="background: #1e293b; color: white;">По сезонам</button>
    </div>
    <div id="collectionContent"></div>
    <div id="innerCollectionView">
        <button id="backToMainCollectionBtn" style="background: none; border: none; color: #3b82f6; font-weight: bold; font-size: 16px; margin-bottom: 15px; cursor: pointer; text-align: left; width: 100%;">⬅ Назад</button>
        <h3 id="innerCollectionTitle" style="text-align: center; margin-bottom: 15px;">Название</h3>
        <div id="innerCollectionList"></div>
    </div>
    <button class="btn-nav" id="backToShopBtn" style="margin-top: 20px;">⬅ Назад в магазин</button>
</div>

<!-- ОКНО ВЫПАДЕНИЯ -->
<div id="revealView">
    <h2 id="revealText" style="color: #fbbf24; margin-bottom: 20px; transform: translateY(-50px); opacity: 0; transition: 0.5s;">Тебе выпал...</h2>
    <div class="card" id="revealCard" style="transform: scale(0); transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);">
        <div class="card-image-container">
            <div class="overall-badge" id="r-overall">89</div>
            <div class="number-badge" id="r-number">#10</div>
            <div id="r-img" style="width: 100%; height: 100%;"></div>
            <div class="top-right-info">
                <div class="season-badge" id="r-season">2016/17</div>
                <div class="club-logo" id="r-clubLogo">ММг</div>
            </div>
        </div>
        <div class="card-info">
            <div class="name" id="r-name">Сергей Мозякин</div>
            <div class="club" id="r-club">Металлург Мг</div>
            <div class="position" id="r-position">Нападающий</div>
            <div class="stats">
                <div class="stat">СКО <span id="r-sc">85</span></div>
                <div class="stat">БРС <span id="r-br">98</span></div>
                <div class="stat">ПАС <span id="r-ps">95</span></div>
                <div class="stat">СИЛ <span id="r-si">80</span></div>
                <div class="stat">ВЫН <span id="r-end">88</span></div>
                <div class="stat">КАТ <span id="r-skate">90</span></div>
            </div>
        </div>
    </div>
    <button class="btn-nav" id="closeRevealBtn" style="margin-top: 30px; opacity: 0; transition: 0.5s;">Забрать в коллекцию</button>
</div>

<!-- ОКНО ПРОСМОТРА -->
<div id="detailView">
    <div class="flip-card" id="flipCard">
        <div class="flip-card-inner">
            <div class="flip-card-front" id="detailFront">
                <div class="card" style="width: 100%; height: 100%;">
                    <div class="card-image-container">
                        <div class="overall-badge" id="d-overall">89</div>
                        <div class="number-badge" id="d-number">#10</div>
                        <div id="d-img" style="width: 100%; height: 100%;"></div>
                        <div class="top-right-info">
                            <div class="season-badge" id="d-season">2016/17</div>
                            <div class="club-logo" id="d-clubLogo">ММг</div>
                        </div>
                    </div>
                    <div class="card-info">
                        <div class="name" id="d-name">Сергей Мозякин</div>
                        <div class="club" id="d-club">Металлург Мг</div>
                        <div class="position" id="d-pos">Нападающий</div>
                        <div class="stats">
                            <div class="stat">СКО <span id="d-sc">85</span></div>
                            <div class="stat">БРС <span id="d-br">98</span></div>
                            <div class="stat">ПАС <span id="d-ps">95</span></div>
                            <div class="stat">СИЛ <span id="d-si">80</span></div>
                            <div class="stat">ВЫН <span id="d-end">88</span></div>
                            <div class="stat">КАТ <span id="d-skate">90</span></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="flip-card-back" id="detailBack"></div>
        </div>
    </div>
    <div class="detail-buttons">
        <button class="btn-sell" id="detailSellBtn">Продать одну (X 🪙)</button>
        <button class="btn-close" id="closeDetailBtn">Закрыть</button>
    </div>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
    window.onerror = function(message, source, lineno, colno, error) {
        alert("ОШИБКА: " + message + "\nСтрока: " + lineno);
        return false;
    };

    const PLAYERS = [
        { name: "Сергей Мозякин", club: "Металлург Мг", season: "2016/17", pos: "Нападающий", number: "#10", logo: "ММг", sc: 90, br: 99, ps: 97, si: 85, end: 92, skate: 94, rarity: "Эпическая", rarity_num: 5, img: "https://nikitasokolovskij19-glitch.github.io/hockey-cards/Datsyuk_1x.png", reg_stats: { games: 60, goals: 48, assists: 35, points: 83, penalty: 20 }, playoff_stats: { games: 18, goals: 7, assists: 10, points: 17, penalty: 4 } },
        { name: "Павел Дацюк", club: "СКА", season: "2016/17", pos: "Нападающий", number: "#13", logo: "СКА", sc: 92, br: 88, ps: 99, si: 80, end: 90, skate: 95, rarity: "Эпическая", rarity_num: 5, img: "https://nikitasokolovskij19-glitch.github.io/hockey-cards/Datsyuk_1x.png", reg_stats: { games: 60, goals: 12, assists: 35, points: 47, penalty: 16 }, playoff_stats: { games: 18, goals: 4, assists: 12, points: 16, penalty: 6 } },
        { name: "Александр Овечкин", club: "Динамо М", season: "2012/13", pos: "Нападающий", number: "#32", logo: "Дин", sc: 99, br: 96, ps: 75, si: 90, end: 93, skate: 88, rarity: "Легендарная", rarity_num: 4, img: "https://nikitasokolovskij19-glitch.github.io/hockey-cards/Datsyuk_1x.png", reg_stats: { games: 31, goals: 19, assists: 21, points: 40, penalty: 14 }, playoff_stats: { games: 15, goals: 8, assists: 7, points: 15, penalty: 8 } },
        { name: "Данис Зарипов", club: "Ак Барс", season: "2014/15", pos: "Нападающий", number: "#25", logo: "АБ", sc: 92, br: 90, ps: 88, si: 75, end: 85, skate: 90, rarity: "Легендарная", rarity_num: 4, img: "https://nikitasokolovskij19-glitch.github.io/hockey-cards/Datsyuk_1x.png", reg_stats: { games: 60, goals: 25, assists: 35, points: 60, penalty: 12 }, playoff_stats: { games: 20, goals: 8, assists: 10, points: 18, penalty: 10 } },
        { name: "Илья Ковальчук", club: "СКА", season: "2015/16", pos: "Нападающий", number: "#17", logo: "СКА", sc: 94, br: 92, ps: 78, si: 85, end: 88, skate: 89, rarity: "Легендарная", rarity_num: 4, img: "https://nikitasokolovskij19-glitch.github.io/hockey-cards/Datsyuk_1x.png", reg_stats: { games: 50, goals: 25, assists: 15, points: 40, penalty: 30 }, playoff_stats: null },
        { name: "Тестовый Супер", club: "Тест", season: "2016/17", pos: "Тест", number: "#1", logo: "ТСТ", sc: 80, br: 80, ps: 80, si: 80, end: 80, skate: 80, rarity: "Супер редкая", rarity_num: 3, img: "https://nikitasokolovskij19-glitch.github.io/hockey-cards/Datsyuk_1x.png", reg_stats: { games: 10, goals: 10, assists: 10, points: 20, penalty: 0 }, playoff_stats: null },
        { name: "Тестовый Редкий", club: "Тест", season: "2016/17", pos: "Тест", number: "#2", logo: "ТСТ", sc: 70, br: 70, ps: 70, si: 70, end: 70, skate: 70, rarity: "Редкая", rarity_num: 2, img: "https://nikitasokolovskij19-glitch.github.io/hockey-cards/Datsyuk_1x.png", reg_stats: { games: 10, goals: 10, assists: 10, points: 20, penalty: 0 }, playoff_stats: null },
        { name: "Тестовый Обычный", club: "Тест", season: "2016/17", pos: "Тест", number: "#3", logo: "ТСТ", sc: 50, br: 50, ps: 50, si: 50, end: 50, skate: 50, rarity: "Обычная", rarity_num: 1, img: "https://nikitasokolovskij19-glitch.github.io/hockey-cards/Datsyuk_1x.png", reg_stats: { games: 10, goals: 10, assists: 10, points: 20, penalty: 0 }, playoff_stats: null }
    ];

    let tg = window.Telegram.WebApp;
    tg.expand();

    let userCoins = parseInt(localStorage.getItem('khl_coins')) || 100;
    let collection = JSON.parse(localStorage.getItem('khl_collection')) || [];
    let currentViewPlayer = null;

    const coinDisplay = document.getElementById('coinDisplay');
    const bonusBtn = document.getElementById('bonusBtn');
    const shopView = document.getElementById('shopView');
    const packsView = document.getElementById('packsView');
    const collectionView = document.getElementById('collectionView');
    const detailView = document.getElementById('detailView');
    const packPrice = 50;
    function updateUI() {
    coinDisplay.innerText = userCoins;
    localStorage.setItem('khl_coins', userCoins);
    if (userCoins < packPrice) {
        document.getElementById('goToPacksBtn').style.display = 'none';
        bonusBtn.style.display = 'block';
    } else {
        document.getElementById('goToPacksBtn').style.display = 'block';
        bonusBtn.style.display = 'none';
    }
}

bonusBtn.addEventListener('click', function() {
    userCoins += 50;
    updateUI();
    alert("Ты получил 50 монет!");
});

document.getElementById('goToPacksBtn').addEventListener('click', function() {
    shopView.style.display = 'none';
    packsView.style.display = 'flex';
});

document.getElementById('backFromPacksBtn').addEventListener('click', function() {
    packsView.style.display = 'none';
    shopView.style.display = 'flex';
});

document.getElementById('viewCollectionBtn').addEventListener('click', function() {
    shopView.style.display = 'none';
    collectionView.style.display = 'flex';
    document.getElementById('collectionContent').style.display = 'block';
    document.getElementById('innerCollectionView').style.display = 'none';
    renderCollection();
});

document.getElementById('backToShopBtn').addEventListener('click', function() {
    collectionView.style.display = 'none';
    shopView.style.display = 'flex';
});

function buyPack(season, price) {
    if (userCoins < price) { alert("У тебя не хватает монет!"); return; }
    const roll = Math.random() * 100; 
    let targetRarityNum = 1;
    if (roll > 99.5) targetRarityNum = 5;
    else if (roll > 95) targetRarityNum = 4;
    else if (roll > 85) targetRarityNum = 3;
    else if (roll > 60) targetRarityNum = 2;

    let availablePlayers = PLAYERS.filter(p => p.season === season && p.rarity_num === targetRarityNum);
    if (availablePlayers.length === 0) availablePlayers = PLAYERS.filter(p => p.season === season);
    if (availablePlayers.length === 0) { alert("В этом сезоне пока нет игроков!"); return; }

    userCoins -= price;
    updateUI();

    const randomIndex = Math.floor(Math.random() * availablePlayers.length);
    const player = availablePlayers[randomIndex];
    collection.push(player);
    localStorage.setItem('khl_collection', JSON.stringify(collection));

    packsView.style.display = 'none';

    document.getElementById('r-name').innerText = player.name;
    document.getElementById('r-club').innerText = player.club;
    document.getElementById('r-season').innerText = player.season;
    document.getElementById('r-position').innerText = player.pos;
    document.getElementById('r-sc').innerText = player.sc;
    document.getElementById('r-br').innerText = player.br;
    document.getElementById('r-ps').innerText = player.ps;
    document.getElementById('r-si').innerText = player.si;
    document.getElementById('r-end').innerText = player.end;
    document.getElementById('r-skate').innerText = player.skate;
    document.getElementById('r-number').innerText = player.number || "";
    document.getElementById('r-clubLogo').innerText = player.logo || "КХЛ";
    
    const overall = Math.round((player.sc + player.br + player.ps + player.si + player.end + player.skate) / 6);
    document.getElementById('r-overall').innerText = overall;
    document.getElementById('r-img').innerHTML = `<img src="${player.img}" style="width: 100%; height: 100%; object-fit: cover; object-position: top center;" onerror="this.style.display='none'; this.parentNode.innerText='🏒';">`;

    let borderColor = "#9ca3af";
    if (player.rarity_num === 2) borderColor = "#a3e635";
    if (player.rarity_num === 3) borderColor = "#3b82f6";
    if (player.rarity_num === 4) borderColor = "#fbbf24";
    if (player.rarity_num === 5) borderColor = "#be123c";
    document.getElementById('revealCard').style.borderColor = borderColor;

    const revealView = document.getElementById('revealView');
    revealView.style.display = 'flex';
    
    const revealCard = document.getElementById('revealCard');
    const revealText = document.getElementById('revealText');
    const closeBtn = document.getElementById('closeRevealBtn');
    
    revealCard.style.transform = 'scale(0)';
    revealText.style.opacity = '0';
    revealText.style.transform = 'translateY(-50px)';
    closeBtn.style.opacity = '0';

    setTimeout(() => {
        revealCard.style.transform = 'scale(1)';
        revealText.style.opacity = '1';
        revealText.style.transform = 'translateY(0)';
        closeBtn.style.opacity = '1';
    }, 100);
}

document.getElementById('closeRevealBtn').addEventListener('click', function() {
    document.getElementById('revealView').style.display = 'none';
    shopView.style.display = 'flex';
});
    
        let currentTab = 'teams';

        document.getElementById('tabTeamsBtn').addEventListener('click', function() {
            currentTab = 'teams';
            document.getElementById('tabTeamsBtn').classList.add('active-tab');
            document.getElementById('tabSeasonsBtn').classList.remove('active-tab');
            document.getElementById('tabTeamsBtn').style.background = '#3b82f6';
            document.getElementById('tabSeasonsBtn').style.background = '#1e293b';
            document.getElementById('collectionContent').style.display = 'block';
            document.getElementById('innerCollectionView').style.display = 'none';
            renderCollection();
        });

        document.getElementById('tabSeasonsBtn').addEventListener('click', function() {
            currentTab = 'seasons';
            document.getElementById('tabSeasonsBtn').classList.add('active-tab');
            document.getElementById('tabTeamsBtn').classList.remove('active-tab');
            document.getElementById('tabSeasonsBtn').style.background = '#3b82f6';
            document.getElementById('tabTeamsBtn').style.background = '#1e293b';
            document.getElementById('collectionContent').style.display = 'block';
            document.getElementById('innerCollectionView').style.display = 'none';
            renderCollection();
        });

        function renderCollection() {
            const container = document.getElementById('collectionContent');
            container.innerHTML = '';
            if (currentTab === 'teams') renderTeamsGrid(container);
            else renderSeasonsList(container);
        }

        function renderTeamsGrid(container) {
            const uniqueTeams = [];
            collection.forEach(p => { if (!uniqueTeams.includes(p.club)) uniqueTeams.push(p.club); });
            if (uniqueTeams.length === 0) { container.innerHTML = '<p style="text-align:center; color:#aaa;">Коллекция пуста. Откройте паки!</p>'; return; }

            const grid = document.createElement('div');
            grid.className = 'teams-grid';
            if (uniqueTeams.length > 16) grid.style.gridTemplateColumns = 'repeat(5, 1fr)';
            else if (uniqueTeams.length > 9) grid.style.gridTemplateColumns = 'repeat(4, 1fr)';

            uniqueTeams.forEach(teamName => {
                const player = collection.find(p => p.club === teamName);
                const logo = player ? player.logo : 'КХЛ';
                const btn = document.createElement('div');
                btn.className = 'team-logo-btn';
                btn.innerHTML = `<div class="team-logo-img">${logo}</div><div class="team-name-text">${teamName}</div>`;
                btn.addEventListener('click', () => { renderTeamSeasons(teamName); });
                grid.appendChild(btn);
            });
            container.appendChild(grid);
        }

        function renderSeasonPlayers(teamName, season) {
    document.getElementById('collectionContent').style.display = 'none';
    document.getElementById('innerCollectionView').style.display = 'block';
    const title = teamName ? `${teamName} • ${season}` : `Сезон ${season}`;
    document.getElementById('innerCollectionTitle').innerText = title;
    const list = document.getElementById('innerCollectionList');
    list.innerHTML = '';

    // 1. Фильтруем игроков
    let playersToShow = teamName ? collection.filter(p => p.club === teamName && p.season === season) : collection.filter(p => p.season === season);

    // 2. Группируем дубликаты
    const grouped = {};
    playersToShow.forEach(player => {
        const key = `${player.name}_${player.season}`;
        if (!grouped[key]) {
            grouped[key] = { ...player, count: 0 };
        }
        grouped[key].count += 1;
    });

    const groupedArray = Object.values(grouped);

    // 3. Сортируем по рейтингу
    groupedArray.sort((a, b) => {
        const ovrA = Math.round((a.sc + a.br + a.ps + a.si + a.end + a.skate) / 6);
        const ovrB = Math.round((b.sc + b.br + b.ps + b.si + b.end + b.skate) / 6);
        return ovrB - ovrA; 
    });

    if (groupedArray.length === 0) { 
        list.innerHTML = '<p style="text-align:center; color:#aaa;">Игроков нет.</p>'; 
    } else {
        groupedArray.forEach(player => {
            const div = document.createElement('div');
            let rarityClass = 'common';
            if (player.rarity_num === 2) rarityClass = 'rare';
            if (player.rarity_num === 3) rarityClass = 'super-rare';
            if (player.rarity_num === 4) rarityClass = 'legendary';
            if (player.rarity_num === 5) rarityClass = 'epic';
            
            const overall = Math.round((player.sc + player.br + player.ps + player.si + player.end + player.skate) / 6);
            
            div.className = `mini-card ${rarityClass}`;
            div.innerHTML = `
                <div style="flex: 1;">
                    <div style="font-weight: bold; display: flex; align-items: center;">
                        ${player.name} 
                        ${player.count > 1 ? `<span style="background: #e11d48; color: white; font-size: 10px; padding: 2px 6px; border-radius: 10px; margin-left: 5px;">x${player.count}</span>` : ''}
                    </div>
                    <div style="font-size: 12px; color: #aaa;">${player.pos} • ${player.number || ''}</div>
                </div>
                <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 5px;">
                    <div style="color: #fbbf24; font-weight: bold; font-size: 18px;">${overall}</div>
                    <button class="open-card-btn" data-name="${player.name}" data-season="${player.season}" style="background: #3b82f6; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer;">Открыть</button>
                </div>
            `;
            list.appendChild(div);
        });

        document.querySelectorAll('#innerCollectionList .open-card-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation(); 
                const name = this.getAttribute('data-name');
                const ssn = this.getAttribute('data-season');
                const playerToOpen = groupedArray.find(p => p.name === name && p.season === ssn);
                if (playerToOpen) openDetailView(playerToOpen);
            });
        });
    }

    document.getElementById('backToMainCollectionBtn').innerText = teamName ? "⬅ Назад к сезонам команды" : "⬅ Назад к сезонам";
    document.getElementById('backToMainCollectionBtn').onclick = () => {
        if (teamName) renderTeamSeasons(teamName);
        else {
            document.getElementById('innerCollectionView').style.display = 'none';
            document.getElementById('collectionContent').style.display = 'block';
            renderCollection();
        }
    };
        }

        function renderSeasonsList(container) {
            const uniqueSeasons = [];
            collection.forEach(p => { if (!uniqueSeasons.includes(p.season)) uniqueSeasons.push(p.season); });
            if (uniqueSeasons.length === 0) { container.innerHTML = '<p style="text-align:center; color:#aaa;">Коллекция пуста. Откройте паки!</p>'; return; }
            uniqueSeasons.sort((a, b) => b.localeCompare(a));

            uniqueSeasons.forEach(season => {
                const btn = document.createElement('div');
                btn.className = 'season-btn';
                const count = collection.filter(p => p.season === season).length;
                btn.innerHTML = `<div style="font-weight: bold; font-size: 16px;">Сезон ${season}</div><div style="color: #fbbf24; font-weight: bold;">${count} игроков</div>`;
                btn.addEventListener('click', () => { renderSeasonPlayers(null, season); });
                container.appendChild(btn);
            });
        }

        function renderSeasonPlayers(teamName, season) {
            document.getElementById('collectionContent').style.display = 'none';
            document.getElementById('innerCollectionView').style.display = 'block';
            const title = teamName ? `${teamName} • ${season}` : `Сезон ${season}`;
            document.getElementById('innerCollectionTitle').innerText = title;
            const list = document.getElementById('innerCollectionList');
            list.innerHTML = '';

            let playersToShow = teamName ? collection.filter(p => p.club === teamName && p.season === season) : collection.filter(p => p.season === season);
            playersToShow.sort((a, b) => {
                const ovrA = Math.round((a.sc + a.br + a.ps + a.si + a.end + a.skate) / 6);
                const ovrB = Math.round((b.sc + b.br + b.ps + b.si + b.end + b.skate) / 6);
                return ovrB - ovrA; 
            });

            if (playersToShow.length === 0) { list.innerHTML = '<p style="text-align:center; color:#aaa;">Игроков нет.</p>'; } 
            else {
                playersToShow.forEach(player => {
                    const div = document.createElement('div');
                    let rarityClass = 'common';
                    if (player.rarity_num === 2) rarityClass = 'rare';
                    if (player.rarity_num === 3) rarityClass = 'super-rare';
                    if (player.rarity_num === 4) rarityClass = 'legendary';
                    if (player.rarity_num === 5) rarityClass = 'epic';
                    const overall = Math.round((player.sc + player.br + player.ps + player.si + player.end + player.skate) / 6);
                    div.className = `mini-card ${rarityClass}`;
                    div.innerHTML = `<div style="flex: 1;"><div style="font-weight: bold; display: flex; align-items: center;">${player.name}</div><div style="font-size: 12px; color: #aaa;">${player.pos} • ${player.number || ''}</div></div><div style="display: flex; flex-direction: column; align-items: flex-end; gap: 5px;"><div style="color: #fbbf24; font-weight: bold; font-size: 18px;">${overall}</div><button class="open-card-btn" data-name="${player.name}" data-season="${player.season}" style="background: #3b82f6; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer;">Открыть</button></div>`;
                    list.appendChild(div);
                });

                document.querySelectorAll('#innerCollectionList .open-card-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation(); 
                        const name = this.getAttribute('data-name');
                        const ssn = this.getAttribute('data-season');
                        const playerToOpen = collection.find(p => p.name === name && p.season === ssn);
                        if (playerToOpen) openDetailView(playerToOpen);
                    });
                });
            }

            document.getElementById('backToMainCollectionBtn').innerText = teamName ? "⬅ Назад к сезонам команды" : "⬅ Назад к сезонам";
            document.getElementById('backToMainCollectionBtn').onclick = () => {
                if (teamName) renderTeamSeasons(teamName);
                else {
                    document.getElementById('innerCollectionView').style.display = 'none';
                    document.getElementById('collectionContent').style.display = 'block';
                    renderCollection();
                }
            };
        }

        function openDetailView(player) {
            currentViewPlayer = player;
            document.getElementById('d-name').innerText = player.name;
            document.getElementById('d-club').innerText = player.club;
            document.getElementById('d-season').innerText = player.season;
            document.getElementById('d-pos').innerText = player.pos;
            document.getElementById('d-sc').innerText = player.sc;
            document.getElementById('d-br').innerText = player.br;
            document.getElementById('d-ps').innerText = player.ps;
            document.getElementById('d-si').innerText = player.si;
            document.getElementById('d-end').innerText = player.end;
            document.getElementById('d-skate').innerText = player.skate;
            document.getElementById('d-number').innerText = player.number || "";
            document.getElementById('d-clubLogo').innerText = player.logo || "КХЛ";
            
            const overall = Math.round((player.sc + player.br + player.ps + player.si + player.end + player.skate) / 6);
            document.getElementById('d-overall').innerText = overall;
            document.getElementById('d-img').innerHTML = `<img src="${player.img}" style="width: 100%; height: 100%; object-fit: cover; object-position: top center;" onerror="this.style.display='none'; this.parentNode.innerText='🏒';">`;

            const sellPrice = overall * 2;
            document.getElementById('detailSellBtn').innerText = `Продать одну (${sellPrice} 🪙)`;

            const backSide = document.getElementById('detailBack');
            let html = `<h3 style="margin-top: 0; font-size: 18px; color: white;">${player.name}</h3><div class="stats-section"><div class="stats-header">Регулярный чемпионат</div><div class="back-stat-row"><span>Игры:</span> <span>${player.reg_stats.games}</span></div><div class="back-stat-row"><span>Голы:</span> <span>${player.reg_stats.goals}</span></div><div class="back-stat-row"><span>Пасы:</span> <span>${player.reg_stats.assists}</span></div><div class="back-stat-row"><span>Очки:</span> <span>${player.reg_stats.points}</span></div><div class="back-stat-row"><span>Штраф:</span> <span>${player.reg_stats.penalty}</span></div></div>`;

            if (player.playoff_stats) {
                html += `<div class="divider"></div><div class="stats-section"><div class="stats-header" style="color: #e11d48;">Плей-офф</div><div class="back-stat-row"><span>Игры:</span> <span>${player.playoff_stats.games}</span></div><div class="back-stat-row"><span>Голы:</span> <span>${player.playoff_stats.goals}</span></div><div class="back-stat-row"><span>Пасы:</span> <span>${player.playoff_stats.assists}</span></div><div class="back-stat-row"><span>Очки:</span> <span>${player.playoff_stats.points}</span></div><div class="back-stat-row"><span>Штраф:</span> <span>${player.playoff_stats.penalty}</span></div></div>`;
            } else { html += `<div style="height: 40px;"></div>`; }

            html += `<div style="margin-top: 15px; font-size: 12px; color: #64748b;">Нажми, чтобы перевернуть</div>`;
            backSide.innerHTML = html;

            let detailBorderColor = "#9ca3af";
            if (player.rarity_num === 2) detailBorderColor = "#a3e635";
            if (player.rarity_num === 3) detailBorderColor = "#3b82f6";
            if (player.rarity_num === 4) detailBorderColor = "#fbbf24";
            if (player.rarity_num === 5) detailBorderColor = "#be123c";
            const detailCard = document.querySelector('#detailView .card');
            if (detailCard) detailCard.style.borderColor = detailBorderColor;

            detailView.style.display = 'flex';
            document.getElementById('flipCard').classList.remove('flipped');
        }

        document.getElementById('flipCard').addEventListener('click', function() {
            this.classList.toggle('flipped');
        });

        document.getElementById('closeDetailBtn').addEventListener('click', function() {
            detailView.style.display = 'none';
            document.getElementById('flipCard').classList.remove('flipped');
        });

        document.getElementById('detailSellBtn').addEventListener('click', function() {
    if (!currentViewPlayer) return;
    const overall = Math.round((currentViewPlayer.sc + currentViewPlayer.br + currentViewPlayer.ps + currentViewPlayer.si + currentViewPlayer.end + currentViewPlayer.skate) / 6);
    const sellPrice = overall * 2;

    if (confirm(`Вы уверены, что хотите продать ${currentViewPlayer.name} за ${sellPrice} монет?`)) {
        const index = collection.findIndex(p => p.name === currentViewPlayer.name && p.season === currentViewPlayer.season);
        if (index !== -1) {
            collection.splice(index, 1);
            localStorage.setItem('khl_collection', JSON.stringify(collection));
            userCoins += sellPrice;
            updateUI();
            alert(`Карточка продана! Вы получили ${sellPrice} 🪙`);
            
            detailView.style.display = 'none';
            document.getElementById('flipCard').classList.remove('flipped');
            
            // ПРИНУДИТЕЛЬНОЕ ОБНОВЛЕНИЕ СПИСКА
            if (document.getElementById('innerCollectionView').style.display === 'block') {
                // Если мы внутри команды/сезона - перерисовываем текущий экран
                const titleParts = document.getElementById('innerCollectionTitle').innerText.split(' • ');
                if (titleParts.length === 2) {
                    renderSeasonPlayers(titleParts[0], titleParts[1]);
                } else {
                    const season = titleParts[0].replace('Сезон ', '');
                    renderSeasonPlayers(null, season);
                }
            }
            renderCollection(); // Обновляем фоновый список
        }
    }
});

        updateUI();
    </script>
