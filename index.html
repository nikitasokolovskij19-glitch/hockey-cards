2<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>КХЛ Карточки</title>
    <style>
        body { background-color: #0f172a; color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 20px; height: 100vh; margin: 0; overflow-y: auto; }
        h2 { margin-top: 0; }
        .card { background: linear-gradient(145deg, #1e293b, #0f172a); border: 2px solid #e11d48; border-radius: 20px; padding: 20px; width: 300px; text-align: center; box-shadow: 0 10px 25px rgba(225, 29, 72, 0.2); position: relative; transition: border-color 0.3s; flex-shrink: 0; }
        .season-badge { position: absolute; top: 10px; right: 10px; background-color: #e11d48; color: white; font-size: 12px; font-weight: bold; padding: 4px 8px; border-radius: 10px; }
        .player-img { width: 100px; height: 100px; background-color: #334155; border-radius: 50%; margin: 10px auto 15px; display: flex; align-items: center; justify-content: center; font-size: 45px; border: 3px solid #475569; }
        .name { font-size: 22px; font-weight: bold; margin-bottom: 5px; text-transform: uppercase; }
        .club { color: #cbd5e1; font-size: 14px; margin-bottom: 5px; }
        .position { color: #e11d48; font-size: 14px; font-weight: bold; margin-bottom: 15px; }
        
        /* Обновленная сетка на 6 характеристик (3 колонки) */
        .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; border-top: 1px solid #334155; padding-top: 15px; }
        .stat { font-size: 11px; color: #94a3b8; display: flex; flex-direction: column; align-items: center; }
        .stat span { font-size: 16px; font-weight: bold; color: white; margin-top: 2px; }
        
        .btn-open { margin-top: 20px; padding: 15px 30px; background-color: #e11d48; color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; width: 300px; transition: 0.2s; box-shadow: 0 4px 15px rgba(225, 29, 72, 0.4); }
        .btn-open:active { transform: scale(0.95); }
        .btn-bonus { margin-top: 10px; padding: 10px; background-color: #10b981; color: white; border: none; border-radius: 12px; font-size: 14px; font-weight: bold; cursor: pointer; width: 300px; display: none; }
        
        .coins-display { margin-bottom: 15px; font-size: 18px; font-weight: bold; color: #fbbf24; }
        
        #collectionView { display: none; width: 100%; max-width: 320px; flex-direction: column; align-items: center; }
        .collection-list { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; width: 100%; }
        .mini-card { background-color: #1e293b; padding: 10px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid #e11d48; }
        .mini-card.legendary { border-left-color: #fbbf24; }
        .mini-card.epic { border-left-color: #a855f7; }
        .btn-nav { margin-top: 15px; background-color: #3b82f6; color: white; border: none; padding: 12px; border-radius: 10px; width: 300px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <!-- ГЛАВНЫЙ ЭКРАН (Магазин) -->
    <div id="shopView" style="display: flex; flex-direction: column; align-items: center;">
        <h2>Твой первый игрок КХЛ</h2>
        <div class="coins-display">Баланс: <span id="coinDisplay">100</span> 🪙</div>
        
        <div class="card" id="playerCard">
            <div class="season-badge" id="season">2016/17</div>
            <div class="player-img" id="img">🏒</div>
            <div class="name" id="name">С. Мозякин</div>
            <div class="club" id="club">Металлург Мг</div>
            <div class="position" id="position">Нападающий</div>
            <div class="stats">
                <div class="stat">СКО <span id="sc">85</span></div>
                <div class="stat">БРС <span id="br">98</span></div>
                <div class="stat">ПАС <span id="ps">95</span></div>
                <div class="stat">СИЛ <span id="si">80</span></div>
                <div class="stat">ВЫН <span id="end">88</span></div>
                <div class="stat">КАТ <span id="skate">90</span></div>
            </div>
        </div>
        
        <button class="btn-open" id="openPackBtn">Открыть пак (50 🪙)</button>
        <button class="btn-bonus" id="bonusBtn">🎁 Получить бонус (+50 🪙)</button>
        <button class="btn-nav" id="viewCollectionBtn">📂 Моя коллекция</button>
    </div>

    <!-- ЭКРАН КОЛЛЕКЦИИ -->
    <div id="collectionView">
        <h2>Моя коллекция</h2>
        <div class="collection-list" id="collectionList"></div>
        <button class="btn-nav" id="backToShopBtn">⬅ Назад в магазин</button>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        // Добавили end (выносливость) и skate (катание)
        const PLAYERS = [
            { name: "С. Мозякин", club: "Металлург Мг", season: "2016/17", pos: "Нападающий", sc: 85, br: 98, ps: 95, si: 80, end: 88, skate: 90, rarity: "Легендарная", img: "🏒" },
            { name: "П. Дацюк", club: "СКА", season: "2016/17", pos: "Нападающий", sc: 88, br: 85, ps: 99, si: 75, end: 85, skate: 92, rarity: "Эпическая", img: "🏒" },
            { name: "А. Овечкин", club: "Динамо М", season: "2012/13", pos: "Нападающий", sc: 99, br: 94, ps: 70, si: 85, end: 90, skate: 85, rarity: "Эпическая", img: "🏒" },
            { name: "Д. Зарипов", club: "Ак Барс", season: "2014/15", pos: "Нападающий", sc: 90, br: 88, ps: 85, si: 70, end: 82, skate: 88, rarity: "Золотая", img: "🏒" },
            { name: "И. Ковальчук", club: "СКА", season: "2015/16", pos: "Нападающий", sc: 92, br: 90, ps: 75, si: 80, end: 86, skate: 87, rarity: "Золотая", img: "🏒" }
        ];

        let tg = window.Telegram.WebApp;
        tg.expand();

        let userCoins = parseInt(localStorage.getItem('khl_coins')) || 100;
        let collection = JSON.parse(localStorage.getItem('khl_collection')) || [];
        
        const coinDisplay = document.getElementById('coinDisplay');
        const openPackBtn = document.getElementById('openPackBtn');
        const bonusBtn = document.getElementById('bonusBtn');
        const shopView = document.getElementById('shopView');
        const collectionView = document.getElementById('collectionView');
        const collectionList = document.getElementById('collectionList');
        const packPrice = 50;

        function updateUI() {
            coinDisplay.innerText = userCoins;
            localStorage.setItem('khl_coins', userCoins);
            
            if (userCoins < packPrice) {
                openPackBtn.style.display = 'none';
                bonusBtn.style.display = 'block';
            } else {
                openPackBtn.style.display = 'block';
                bonusBtn.style.display = 'none';
            }
        }

        openPackBtn.addEventListener('click', function() {
            userCoins -= packPrice;
            updateUI();
            
            openPackBtn.innerText = "Открываем...";
            
            const randomIndex = Math.floor(Math.random() * PLAYERS.length);
            const player = PLAYERS[randomIndex];
            collection.push(player);
            localStorage.setItem('khl_collection', JSON.stringify(collection));

            setTimeout(() => {
                document.getElementById('name').innerText = player.name;
                document.getElementById('club').innerText = player.club;
                document.getElementById('season').innerText = player.season;
                document.getElementById('position').innerText = player.pos;
                document.getElementById('sc').innerText = player.sc;
                document.getElementById('br').innerText = player.br;
                document.getElementById('ps').innerText = player.ps;
                document.getElementById('si').innerText = player.si;
                document.getElementById('end').innerText = player.end;
                document.getElementById('skate').innerText = player.skate;
                document.getElementById('img').innerText = player.img;

                const borderColor = player.rarity === "Легендарная" ? "#fbbf24" : (player.rarity === "Эпическая" ? "#a855f7" : "#e11d48");
                document.getElementById('playerCard').style.borderColor = borderColor;

                openPackBtn.innerText = `Открыть пак (50 🪙)`;
                alert(`Тебе выпал: ${player.name} (${player.rarity})!`);
                updateUI();
            }, 500);
        });

        bonusBtn.addEventListener('click', function() {
            userCoins += 50;
            updateUI();
            alert("Ты получил 50 монет!");
        });

        document.getElementById('viewCollectionBtn').addEventListener('click', function() {
            shopView.style.display = 'none';
            collectionView.style.display = 'flex';
            renderCollection();
        });

        document.getElementById('backToShopBtn').addEventListener('click', function() {
            collectionView.style.display = 'none';
            shopView.style.display = 'flex';
        });

        function renderCollection() {
    collectionList.innerHTML = ''; 
    const reversedCollection = [...collection].reverse();

    reversedCollection.forEach((player, index) => {
        const div = document.createElement('div');
        let rarityClass = '';
        if (player.rarity === 'Легендарная') rarityClass = 'legendary';
        if (player.rarity === 'Эпическая') rarityClass = 'epic';

        const overall = Math.round((player.sc + player.br + player.ps + player.si + player.end + player.skate) / 6);
        
        // Цена продажи зависит от рейтинга (например, 2 монеты за 1 очко рейтинга)
        const sellPrice = overall * 2;

        div.className = `mini-card ${rarityClass}`;
        div.innerHTML = `
            <div style="flex: 1;">
                <div style="font-weight: bold;">${player.name}</div>
                <div style="font-size: 12px; color: #aaa;">${player.club} • ${player.season}</div>
            </div>
            <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 5px;">
                <div style="color: #fbbf24; font-weight: bold; font-size: 18px;">${overall}</div>
                <button class="sell-btn" data-index="${collection.length - 1 - index}" style="background: #e11d48; color: white; border: none; padding: 4px 8px; border-radius: 5px; font-size: 10px; cursor: pointer;">Продать (${sellPrice} 🪙)</button>
            </div>
        `;
        collectionList.appendChild(div);
    });

    // Добавляем обработчики для кнопок "Продать"
    document.querySelectorAll('.sell-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            const originalIndex = parseInt(this.getAttribute('data-index'));
            sellCard(originalIndex);
        });
    });
}

// Функция продажи карточки
function sellCard(index) {
    const player = collection[index];
    const overall = Math.round((player.sc + player.br + player.ps + player.si + player.end + player.skate) / 6);
    const sellPrice = overall * 2;

    if (confirm(`Вы уверены, что хотите продать ${player.name} за ${sellPrice} монет?`)) {
        collection.splice(index, 1); // Удаляем из массива
        localStorage.setItem('khl_collection', JSON.stringify(collection)); // Сохраняем
        
        userCoins += sellPrice;
        updateUI(); // Обновляем баланс
        
        renderCollection(); // Перерисовываем список
        alert(`Карточка продана! Вы получили ${sellPrice} 🪙`);
    }
}

        updateUI();
    </script>
</body>
</html>
